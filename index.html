let language='en',mode='study',deck=[...countries],index=0,revealed=false,questions=[],qIndex=0,score=0,answered=false,missed=[],choices=[];
const content=document.querySelector('#content');
const name=c=>c[language],other=c=>c[language==='en'?'tr':'en'];
const nationality=c=>language==='en'?c.natEn+' / '+c.natTr:c.natTr+' / '+c.natEn;
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function flag(c){return `<img src="${c.img}" alt="${mode==='gallery'||revealed?'Flag of '+c.en:'Flag to identify'}">`}
function changeMode(next){mode=next;document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode)});if(mode==='quiz')startQuiz();else render()}
function render(){if(mode==='study')renderStudy();else if(mode==='gallery')renderGallery();else renderQuiz()}
function renderStudy(){const c=deck[index];content.innerHTML=`<div class="study-layout"><div class="panel"><div class="eyebrow">Flashcard ${index+1} of ${deck.length}</div><div class="flag-stage">${flag(c)}</div><div class="answer" aria-live="polite">${revealed?`<h1>${name(c)}</h1><p>${other(c)}</p><p class="nationality">Nationality: ${nationality(c)}</p>`:'<h1>Which country is this?</h1><p>Think of the country and nationality, then reveal them.</p>'}</div><div class="controls"><button class="btn" id="previous">Previous</button><button class="btn primary" id="reveal">${revealed?'Hide name':'Show name'}</button><button class="btn" id="next">Next</button><button id="shuffle" class="btn">Shuffle</button></div><div class="progress"><div style="width:${(index+1)/deck.length*100}%"></div></div></div><aside><h2>A little practice</h2><p>Say the country name out loud before checking your answer.</p><p>Use <kbd>←</kbd> and <kbd>→</kbd> to move between flags. Press <kbd>Space</kbd> to reveal the name.</p><button id="quiz-start" class="btn">Try the quiz</button></aside></div>`;document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#reveal').onclick=()=>{revealed=!revealed;render()};document.querySelector('#shuffle').onclick=()=>{deck=shuffle(deck);index=0;revealed=false;render()};document.querySelector('#quiz-start').onclick=()=>changeMode('quiz')}
function move(n){index=(index+n+deck.length)%deck.length;revealed=false;render()}
function renderGallery(){content.innerHTML=`<div class="gallery">${countries.map(c=>`<article class="tile">${flag(c)}<h2>${name(c)}</h2><p>${other(c)}</p><p class="nationality">${nationality(c)}</p></article>`).join('')}</div>`}
function startQuiz(list=countries){questions=shuffle(list);qIndex=0;score=0;answered=false;missed=[];newChoices();renderQuiz()}
function newChoices(){const c=questions[qIndex];choices=c?shuffle([c,...shuffle(countries.filter(x=>x.code!==c.code)).slice(0,3)]):[]}
function renderQuiz(){if(qIndex>=questions.length){content.innerHTML=`<div class="panel quiz result"><div class="eyebrow">Quiz complete</div><h1>${score} / ${questions.length}</h1><p>${score===questions.length?'Excellent! You identified every flag.':'Keep practicing. Each round makes the flags more familiar.'}</p><div class="controls"><button class="btn primary" id="restart">Try all flags again</button>${missed.length?'<button class="btn" id="retry">Practice missed flags</button>':''}</div></div>`;document.querySelector('#restart').onclick=()=>startQuiz();if(missed.length)document.querySelector('#retry').onclick=()=>startQuiz([...missed]);return}const c=questions[qIndex];content.innerHTML=`<div class="panel quiz"><div class="quiz-head"><span class="eyebrow">Question ${qIndex+1} of ${questions.length}</span><span>Score: ${score}</span></div><div class="flag-stage">${flag(c)}</div><h2 style="text-align:center">Which country is this?</h2><div class="options">${choices.map(x=>`<button class="option" data-code="${x.code}">${name(x)}</button>`).join('')}</div><div class="feedback" role="status"></div><div class="controls"><button class="btn primary" id="continue" hidden>${qIndex===questions.length-1?'See results':'Next question'}</button></div></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b.dataset.code));document.querySelector('#continue').onclick=()=>{qIndex++;answered=false;newChoices();renderQuiz()}}
function answer(code){if(answered)return;answered=true;const c=questions[qIndex],correct=code===c.code;if(correct)score++;else missed.push(c);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.code===c.code)b.classList.add('correct');else if(b.dataset.code===code)b.classList.add('wrong')});document.querySelector('.feedback').textContent=(correct?'Correct! '+name(c):'The answer is '+name(c)+' ('+other(c)+').')+' — Nationality: '+nationality(c);document.querySelector('.quiz-head span:last-child').textContent='Score: '+score;const next=document.querySelector('#continue');next.hidden=false;next.focus()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>changeMode(b.dataset.mode));document.querySelector('#language').onchange=e=>{language=e.target.value;if(mode==='quiz'&&answered){const buttons=[...document.querySelectorAll('.option')];buttons.forEach(b=>{b.textContent=name(countries.find(c=>c.code===b.dataset.code))});const c=questions[qIndex];if(c)document.querySelector('.feedback').textContent='Answer: '+name(c)+' ('+other(c)+') — Nationality: '+nationality(c);else render()}else render()};document.addEventListener('keydown',e=>{if(mode!=='study'||['SELECT','INPUT'].includes(e.target.tagName))return;if(e.code==='ArrowRight'){e.preventDefault();move(1)}if(e.code==='ArrowLeft'){e.preventDefault();move(-1)}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();revealed=!revealed;render()}});render();
</script></body></html>
